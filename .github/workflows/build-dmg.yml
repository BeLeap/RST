name: Build DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-latest
    defaults:
      run:
        shell: zsh -euo pipefail {0}
    env:
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      APP_PATH: ${{ github.workspace }}/build/DerivedData/Build/Products/Release/RST.app
      DMG_PATH: ${{ github.workspace }}/build/RST.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync and verify submodules
        run: |
          git submodule status --recursive || true
          git submodule sync --recursive
          git submodule update --init --recursive
          if [[ ! -f Vendor/whisper.cpp/CMakeLists.txt ]]; then
            whisper_url="$(git config -f .gitmodules --get submodule.Vendor/whisper.cpp.url)"
            whisper_rev="$(git rev-parse HEAD:Vendor/whisper.cpp)"
            rm -rf Vendor/whisper.cpp
            git clone "$whisper_url" Vendor/whisper.cpp
            git -C Vendor/whisper.cpp checkout "$whisper_rev"
          fi
          if [[ ! -f Vendor/llama.cpp/CMakeLists.txt ]]; then
            llama_url="$(git config -f .gitmodules --get submodule.Vendor/llama.cpp.url)"
            llama_rev="$(git rev-parse HEAD:Vendor/llama.cpp)"
            rm -rf Vendor/llama.cpp
            git clone "$llama_url" Vendor/llama.cpp
            git -C Vendor/llama.cpp checkout "$llama_rev"
          fi
          git submodule status --recursive || true
          ls -la Vendor
          test -f Vendor/whisper.cpp/CMakeLists.txt
          test -f Vendor/llama.cpp/CMakeLists.txt

      - name: Build embedded whisper framework
        run: ./scripts/build-whisper-framework.sh

      - name: Build embedded llama framework
        run: ./scripts/build-llama-framework.sh

      - name: Build macOS app
        run: |
          xcodebuild \
            -project RST.xcodeproj \
            -scheme RST \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            build

      - name: Package DMG
        run: ./scripts/create-dmg.sh "$APP_PATH" "$DMG_PATH"

      - name: Upload app artifact
        uses: actions/upload-artifact@v6
        with:
          name: RST-app
          path: ${{ env.APP_PATH }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: RST-dmg
          path: ${{ env.DMG_PATH }}
